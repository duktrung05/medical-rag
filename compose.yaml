name: medical-rag
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEDRAG_PORT:-8000}:8000"
    environment:
      MEDRAG_PREPARED: /app/outputs/v4/prepared.jsonl
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./outputs
        target: /app/outputs
        read_only: true
        bind:
          create_host_path: false
