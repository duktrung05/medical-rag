experiment_name: smoke_sparse_char_ngram
backend: sparse
corpus: ../data/medquad/dev/chunks.jsonl
retrieval:
  sparse:
    enabled: true
    engine: bm25
    tokenizer: char_ngram
    char_ngram_size: 3
    index_path: ../artifacts/medquad_char_ngram_index
    top_k: 100
  dense:
    enabled: false
fusion:
  enabled: false
scoring:
  document:
    aggregation: max
selection:
  chunk:
    threshold: 0
    relative_delta: 1000000
    min_k: 0
    max_k: 100
  document:
    threshold: 0
    relative_delta: 1000000
    min_k: 0
    max_k: 100
