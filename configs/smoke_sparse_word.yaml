experiment_name: smoke_sparse_word
backend: sparse
corpus: ../data/xquad/dev/chunks.jsonl
retrieval:
  sparse:
    enabled: true
    engine: bm25
    tokenizer: word
    index_path: ../artifacts/sparse_word_index
    top_k: 100
  dense:
    enabled: false
fusion:
  enabled: false
scoring:
  document:
    aggregation: max
selection:
  chunk:
    threshold: 0
    relative_delta: 1000000
    min_k: 0
    max_k: 100
  document:
    threshold: 0
    relative_delta: 1000000
    min_k: 0
    max_k: 100
