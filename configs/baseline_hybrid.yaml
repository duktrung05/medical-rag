# Configuration: Baseline 2 (BM25 + Dense Hybrid with RRF)
experiment_name: "baseline_hybrid"
backend: hybrid
corpus: "../data/medquad/dev/chunks.jsonl"

retrieval:
  sparse:
    enabled: true
    engine: "bm25"
    index_path: "../artifacts/medquad_bm25_index"
    top_k: 200
  dense:
    enabled: true
    model_name: "BAAI/bge-m3"
    revision: "5617a9f61b028005a4858fdac845db406aefb181"
    index_path: "../artifacts/medquad_dense_index"
    top_k: 300
    batch_size: 32

fusion:
  enabled: true
  method: "rrf"
  rrf_k: 60
  top_k: 200

reranker:
  enabled: false

scoring:
  document:
    aggregation: "max"

selection:
  chunk:
    threshold: 0.015  # RRF score threshold
    relative_delta: 0.010
    min_k: 1
    max_k: 20
  document:
    threshold: 0.015
    relative_delta: 0.010
    min_k: 1
    max_k: 10
