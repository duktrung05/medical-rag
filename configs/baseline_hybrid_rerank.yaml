# Configuration: Baseline 3 (BM25 + Dense + RRF + BGE Reranker)
experiment_name: "baseline_hybrid_rerank"
backend: hybrid
corpus: "../data/xquad/dev/chunks.jsonl"

retrieval:
  sparse:
    enabled: true
    engine: "bm25"
    index_path: "artifacts/sparse_index"
    top_k: 200
  dense:
    enabled: true
    model_name: "BAAI/bge-m3"
    revision: "5617a9f61b028005a4858fdac845db406aefb181"
    index_path: "../artifacts/dense_index"
    top_k: 300
    batch_size: 32

fusion:
  enabled: true
  method: "rrf"
  rrf_k: 60
  top_k: 150

reranker:
  enabled: true
  model_name: "BAAI/bge-reranker-v2-m3"
  top_k: 100
  batch_size: 16

scoring:
  document:
    aggregation: "max"  # Score(doc) = max_{c in doc} Score(c)

selection:
  chunk:
    threshold: 0.50
    relative_delta: 0.30
    min_k: 1
    max_k: 20
  document:
    threshold: 0.50
    min_k: 1
    max_k: 20
