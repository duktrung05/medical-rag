experiment_name: baseline_hybrid_rerank
backend: hybrid
corpus: ../data/medquad/dev/chunks.jsonl
retrieval:
  sparse:
    enabled: true
    index_path: ../artifacts/medquad_bm25_index
    top_k: 200
  dense:
    enabled: true
    model_name: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    encoder_profile: bge_m3
    pooling: cls
    query_prefix: ''
    passage_prefix: ''
    index_path: ../artifacts/medquad_dense_index
    top_k: 300
    batch_size: 32
fusion:
  enabled: true
  method: rrf
  rrf_k: 60
  top_k: 200
reranker:
  enabled: true
  model_name: BAAI/bge-reranker-v2-m3
  revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
  precision: float16
  top_k: 100
  batch_size: 16
  max_length: 512
  device: cuda
scoring:
  document:
    aggregation: max
selection:
  chunk:
    threshold: 0.015
    relative_delta: 0.01
    min_k: 1
    max_k: 20
  document:
    threshold: 0.015
    relative_delta: 0.01
    min_k: 1
    max_k: 10
