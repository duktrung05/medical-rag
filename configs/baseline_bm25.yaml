# Configuration: Baseline 0 (BM25 Sparse Retrieval)
experiment_name: "baseline_bm25"
backend: sparse
corpus: "../data/medquad/dev/chunks.jsonl"

retrieval:
  sparse:
    enabled: true
    engine: "bm25"  # "rank_bm25" or "tantivy"
    index_path: "../artifacts/medquad_bm25_index"
    top_k: 200
  dense:
    enabled: false

fusion:
  enabled: false

reranker:
  enabled: false

scoring:
  document:
    aggregation: "max"  # "max" or "hybrid_mean"
    top_n_mean: 3

selection:
  chunk:
    threshold: 0.35
    relative_delta: 0.25
    min_k: 1
    max_k: 20
  document:
    threshold: 0.35
    relative_delta: 0.25
    min_k: 1
    max_k: 10
