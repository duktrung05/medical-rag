[project]
name = "medical-rag"
version = "4.0.0a0"
description = "Versioned multilingual Medical-RAG V4 core with optional V5 extensions"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "R2AI Team" }
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "charset-normalizer>=3.3.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
    "tokenizers>=0.20.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
v4-models = [
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.2.0",
    "faiss-cpu>=1.8.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
retrieval = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "faiss-cpu>=1.8.0",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
medrag = "src.medrag.cli:main"
medrag-v4 = "src.medrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
