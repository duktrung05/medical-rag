[project]
name = "r2ai-medical-retrieval"
version = "0.1.0"
description = "Multilingual Medical Information Retrieval System for R2AI Competition"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "R2AI Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]
retrieval = [
    "rank-bm25>=0.2.2",
    "tantivy>=0.22.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "faiss-cpu>=1.8.0",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
